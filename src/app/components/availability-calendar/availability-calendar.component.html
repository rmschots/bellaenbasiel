<div class="calname">{{ name }}</div>
<div class="calgrid">
  @for (weekday of weekdays$ | async; track $index) {
    <span class="cwd">{{ weekday }}</span>
  }
  @for (cell of cells$ | async; track $index) {
    <span class="cd"
          [class.na]="cell.state === 'booked'"
          [class.past]="cell.state === 'past'"
          [class.blank]="cell.state === 'blank'">{{ cell.day }}</span>
  }
</div>
