<div class="sec">
  <div class="wrap1100">
    <div class="eyebrow">{{ 'ACTIVITIES.title' | transloco }}</div>
    <h2 class="h2">{{ 'ACTIVITIES.heading' | transloco }}</h2>
    <p class="lede">{{ 'ACTIVITIES.lede' | transloco }}</p>
    <div class="actgrid">
      @for (card of activityCards; track card.key) {
        <div class="actcard">
          <img appFadeIn loading="lazy" [src]="card.image"
               [alt]="('ACTIVITIES.' + card.key + '.title') | transloco">
          <div class="actshade"></div>
          <div class="actbody">
            <h3 class="acttitle">{{ ('ACTIVITIES.' + card.key + '.title') | transloco }}</h3>
            <p class="acttext">{{ ('ACTIVITIES.' + card.key + '.text') | transloco }}</p>
          </div>
        </div>
      }
    </div>
  </div>
</div>
