<div class="sec">
  <div class="wrap1100">
    <div class="eyebrow">{{ 'WELCOME.title' | transloco }}</div>
    <h2 class="h2" [innerHTML]="'WELCOME.heading' | transloco"></h2>
    @for (row of storyRows; track row.key; let i = $index) {
      <div class="storyrow" [class.rev]="i % 2 === 1">
        <div class="storyimgbox">
          <img class="storyimg" appFadeIn loading="lazy" [src]="row.image" [alt]="row.alt">
          <div class="storyframe"></div>
        </div>
        <div>
          <div class="storyn">0{{ i + 1 }} — {{ ('WELCOME.' + row.key + '.kicker') | transloco }}</div>
          <h3 class="h3">{{ ('WELCOME.' + row.key + '.title') | transloco }}</h3>
          <p class="storytext">{{ ('WELCOME.' + row.key + '.text') | transloco }}</p>
        </div>
      </div>
    }
  </div>
</div>
