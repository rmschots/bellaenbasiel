<header class="hero">
  <img class="heroimg" appFadeIn fetchpriority="high" src="/assets/img/home_img1.jpg"
       alt="Bruges canal near Bella &amp; Basiel">
  <div class="heroshade"></div>
  <div class="heroin">
    <div class="herokick">{{ 'HEADER.kicker' | transloco }}</div>
    <h1 class="herotitle">Bella &amp; Basiel</h1>
    <p class="herosub">{{ 'HEADER.subtitle' | transloco }}</p>
    <div class="heroctas">
      <a class="btn btn-solid" href="#room" (click)="scrollTo('room', $event)">
        {{ 'HEADER.checkAvailability' | transloco }}
      </a>
      <a class="btn btn-ghost" href="#welcome" (click)="scrollTo('welcome', $event)">
        {{ 'HEADER.discoverHouse' | transloco }}
      </a>
    </div>
    <div class="trustbar">
      <a class="trust" href="https://www.booking.com/hotel/be/b-amp-b-bella-en-basiel" target="_blank" rel="noopener">
        <span class="tnum">9.7</span><span class="tlabel">booking.com</span>
      </a>
      <a class="trust" href="https://maps.app.goo.gl/4EJjqJp1sA3AG3ys8" target="_blank" rel="noopener">
        <span class="tnum">5.0 ★</span><span class="tlabel">Google reviews</span>
      </a>
      <div class="trust">
        <span class="tnum">Superhost</span><span class="tlabel">Airbnb</span>
      </div>
    </div>
  </div>
</header>
